{%- assign day = page.date | date: '%Y-%m-%d' -%}
{%- assign dest = site.baseurl | append: '/#journal/' | append: day -%}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ page.title }} · Awin Trades</title>
<meta name="description" content="{{ page.takeaway | default: site.description | escape }}">
<meta property="og:site_name" content="Awin Trades">
<meta property="og:title" content="{{ page.title | escape }} · {{ page.date | date: '%b %-d, %Y' }}">
<meta property="og:description" content="{{ page.takeaway | default: site.description | escape }}">
<meta property="og:url" content="{{ site.url }}{{ dest }}">
<meta name="theme-color" content="#a3b19b">
<meta http-equiv="refresh" content="0; url={{ dest }}">
<link rel="canonical" href="{{ site.url }}{{ dest }}"></head>
<body style="background:#121414;color:#f4f1eb;font-family:system-ui,sans-serif"><p><a style="color:#f4f1eb" href="{{ dest }}">Go to this journal entry</a></p></body></html>
