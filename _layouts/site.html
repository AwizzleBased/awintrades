<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
{% include meta.html %}
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}

.vintro { color: var(--muted); margin: -6px 0 18px; }
.vids .vlink { color: var(--ink); text-decoration: none; display: inline-flex; align-items: baseline; gap: 8px; }
.vids .vlink:hover b, .vids .vlink:focus-visible b { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--sage); }
.vids .vlink .arr { color: var(--sage); font-size: 14px; }
.vids .vsrc { display: block; margin-top: 2px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
/* motion: phase 1 */
@media (prefers-reduced-motion: no-preference) {
  @keyframes fadein { from { opacity: 0; } }
  .mo .view:not([hidden]) { animation: fadein .45s ease both; }
  .mo #entryPanel > * { animation: fadein .45s ease both; }
  .mo dialog.zoom[open] { animation: fadein .25s ease both; }
  .mo .rv { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
  .mo .rv.in { opacity: 1; transform: none; }
  .mo .sketch polyline { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
  .mo .sketch rect, .mo .sketch line, .mo .sketch text { opacity: 0; }
  .mo .sketch.in polyline { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.5s ease .25s, opacity .01s linear .25s; }
  .mo .sketch.in rect, .mo .sketch.in line, .mo .sketch.in text { opacity: 1; transition: opacity .6s ease 1.5s; }
  .shots img { transition: transform .6s ease; }
  .shots a:hover img { transform: scale(1.03); }
  .mo .trendline polyline { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .mo .trendline.in polyline { stroke-dashoffset: 0; transition: stroke-dashoffset 2.8s cubic-bezier(.4, 0, .2, 1) .3s; }
}
.trendline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40%; pointer-events: none; }
.trendline polyline { fill: none; stroke: var(--sage); stroke-opacity: .26; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.hero .wrap { position: relative; z-index: 1; }
</style>
</head>
<body data-view="{{ page.view }}">
{%- if page.view == 'home' %}
<script>
/* old one-page links (#journal, #about, #journal/2026-11-25 …) go to the real pages */
(function () {
  var h = location.hash.slice(1), m = h.match(/^(journal|learn|how|community|about)(?:\/(.*))?$/);
  if (!m) return;
  var p = { journal: 'journal/', learn: 'learn/', how: 'how-i-trade/', community: 'community/', about: 'about/' }[m[1]];
  location.replace('{{ site.baseurl }}/' + p + (m[2] ? '#' + m[2] : ''));
})();
</script>
{%- endif %}

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: dark editorial site. Home = hero (headline left, drawn "monitor" chart right) → three-pillar row → journal preview (sunrise background + notebook photo) → community + about split → footer. Inner views (journal, how I trade, community, about) share one narrow column. Deliberately dark-only. */
:root {
  --bg: #121414;
  --band: #171a19;
  --panel: #1c1f1e;
  --line: #2e3330;
  --ink: #fbfaf8;
  --muted: #c6cacc;
  --sage: #8cc8ec;
  --sage-ink: #0b1418;
  --glow: #d9a27f;
  --sea: #7fa7b8;
  --long: #8fcfb3;
  --short: #e3998a;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; border-radius: 2px; }
.view[hidden] { display: none !important; }

.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--sans); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 16px; }
.eyebrow::after { content: ""; width: 44px; height: 1px; background: var(--line); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 24px; font-size: 15px; text-decoration: none; border-radius: 2px; transition: background .25s, color .25s, border-color .25s; }
.btn .arr { transition: transform .25s; }
.btn:hover .arr { transform: translateX(3px); }
.btn.solid { background: var(--sage); color: var(--sage-ink); font-weight: 500; }
.btn.solid:hover { background: #a8d6f2; }
.btn.line { border: 1px solid var(--ink); }
.btn.line:hover { border-color: var(--sage); color: var(--sage); }
.btn.text { padding: 0; min-height: 44px; }
.btn.text:hover { color: var(--sage); }
.soon { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); }

/* header */
header.site { position: relative; z-index: 2; border-bottom: 1px solid var(--line); }
header.site .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 28px; padding-block: 20px; }
.brand { display: flex; align-items: center; gap: 22px; text-decoration: none; }
.brand svg { width: 40px; height: 32px; flex: none; }
.brand .word { font-size: 14px; letter-spacing: .38em; text-transform: uppercase; }
.brand .tag { font-family: var(--display); font-style: italic; font-size: 20px; color: var(--muted); padding-left: 22px; border-left: 1px solid var(--line); }
nav.main { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 30px; font-size: 14px; }
nav.main a { text-decoration: none; color: var(--ink); padding-block: 6px; }
nav.main a:hover, nav.main a[aria-current="page"] { color: var(--sage); }
nav.main .join { border: 1px solid var(--ink); padding: 8px 16px; border-radius: 4px; font-size: 13px; }

/* hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
  background:
    radial-gradient(60% 55% at 80% 6%, rgba(217,162,127,.24), transparent 70%),
    radial-gradient(45% 45% at 96% 70%, rgba(127,167,184,.12), transparent 70%),
    radial-gradient(35% 40% at 10% 100%, rgba(163,177,155,.07), transparent 70%),
    linear-gradient(180deg, #181a18 0%, var(--bg) 100%); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 40px; align-items: center; padding-block: 72px 64px; }
.hero h1 { font-family: var(--display); font-size: clamp(52px, 7.2vw, 96px); line-height: .98; letter-spacing: -.01em; }
.hero h1 em { display: block; font-style: italic; color: var(--sage); }
.hero .lead { margin-top: 28px; font-size: 19px; font-weight: 300; line-height: 1.55; max-width: 30em; }
.hero .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; margin-top: 36px; }
.hero .meta { margin-top: 40px; display: flex; align-items: center; gap: 14px; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.hero .meta::before { content: ""; width: 36px; height: 1px; background: var(--line); }

.desk { position: relative; min-width: 0; }
.monitor { position: relative; border-radius: 10px; padding: 10px; background: linear-gradient(180deg, #1b1e1d, #0e100f); border: 1px solid #2c302e; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
.screen { position: relative; border-radius: 4px; overflow: hidden; background: #0a0c0b; aspect-ratio: 16 / 10; }
.screen canvas { display: block; width: 100%; height: 100%; }
.screen .chip { position: absolute; left: 14px; top: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.screen .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--long); animation: pulse 2.4s ease-in-out infinite; }
.screen .tv { position: absolute; inset: 0; }
.screen .tv[hidden] { display: none; }
.screen .tv .tradingview-widget-container, .screen .tv .tradingview-widget-container__widget { width: 100%; height: 100%; }
.desk .credit { display: block; text-align: right; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.desk .credit[hidden] { display: none; }
.screen .illus2 { position: absolute; right: 14px; bottom: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .06em; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.ledline { height: 2px; margin: 14px 8% 0; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--glow), transparent); opacity: .55; }

/* pillars */
.pillars { background: var(--band); border-bottom: 1px solid var(--line); }
.pillars .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pillar { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 22px; align-items: start; padding: 36px 32px; }
.pillar + .pillar { border-left: 1px solid var(--line); }
.pillar svg { width: 44px; height: 44px; stroke: var(--muted); fill: none; stroke-width: 1.3; }
.pillar h3 { font-family: var(--display); font-size: 27px; line-height: 1.15; }
.pillar p { margin-top: 6px; color: var(--muted); font-size: 15px; }

/* journal preview */
.preview { position: relative; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(9% 7% at 54% 74%, rgba(246,196,150,.55) 0%, rgba(240,180,130,.22) 55%, transparent 100%),
    radial-gradient(55% 50% at 54% 76%, rgba(233,170,122,.34) 0%, rgba(217,162,127,.13) 40%, transparent 72%),
    radial-gradient(120% 60% at 50% 0%, rgba(127,167,184,.10) 0%, transparent 60%),
    linear-gradient(180deg, #151a1d 0%, #1a1f22 48%, #2a2522 71%, #3a2c24 73.5%, #1a2226 74%, #141b1f 86%, #111618 100%); }
.preview::before { content: ""; position: absolute; inset: 74% 0 0 0; z-index: -1;
  background: repeating-linear-gradient(180deg, rgba(240,180,130,.16) 0 1px, transparent 1px 8px);
  -webkit-mask-image: radial-gradient(38% 90% at 54% 0%, #000 0%, transparent 75%); mask-image: radial-gradient(38% 90% at 54% 0%, #000 0%, transparent 75%); }
.preview::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(18,20,20,.55) 0%, rgba(18,20,20,.15) 45%, transparent 70%); }
.preview .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: 88px; }
.preview h2 { font-family: var(--display); font-size: clamp(38px, 4.4vw, 52px); line-height: 1.08; margin-top: 22px; }
.preview p.body { margin-top: 18px; color: var(--muted); font-size: 17px; max-width: 30em; }
.preview .btn { margin-top: 30px; background: rgba(18,20,20,.35); }
.notebook { margin: 0; justify-self: end; width: 100%; max-width: 520px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(244,241,235,.10); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); }
.notebook img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; filter: saturate(.8) brightness(.88) sepia(.08); }

/* community: soft dusk beach */
.beach { position: relative; overflow: hidden; border-top: 1px solid var(--line); background: #15171c; min-height: 460px; display: grid; align-items: center; }
.beach .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 55%; filter: saturate(.85) brightness(.82); }
.beach .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,13,13,.92) 0%, rgba(12,13,13,.7) 38%, rgba(12,13,13,.15) 75%), linear-gradient(180deg, rgba(12,13,13,.35) 0%, rgba(12,13,13,0) 30%, rgba(12,13,13,0) 75%, rgba(12,13,13,.5) 100%); }
.beach .wrap { position: relative; width: 100%; box-sizing: border-box; padding-block: 72px; }
.beach .copy { max-width: 470px; display: grid; gap: 16px; }
.beach h2 { font-family: var(--display); font-size: clamp(36px, 4.4vw, 52px); line-height: 1.06; }
.beach p { color: #d6d9da; }

/* about */
.about-band { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--band); }
.about-band .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 48px; align-items: center; padding-block: 64px; }
.about-band .copy { display: grid; gap: 16px; }
.about-band h2 { font-family: var(--display); font-size: clamp(32px, 3.6vw, 44px); line-height: 1.1; }
.about-band p { color: var(--muted); max-width: 36em; }
.routine { margin: 0; padding: 22px 24px; list-style: none; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(217,162,127,.06), rgba(127,167,184,.04)), var(--panel); display: grid; gap: 0; }
.routine .title { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; }
.routine li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.routine .t { font-family: var(--mono); font-size: 12.5px; color: var(--sage); padding-top: 2px; }
.routine .note { font-size: 12.5px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); display: block; }
.path { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); }
.path li { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.path li:first-child { border-left: 0; }
.path .n { font-family: var(--mono); font-size: 12px; color: var(--sage); }
.path li.here { background: linear-gradient(180deg, rgba(217,162,127,.10), rgba(127,167,184,.05)); color: var(--ink); }
.path-src { font-size: 13px !important; }
.path-src a, .story p a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
@media (max-width: 640px) { .path { grid-template-columns: 1fr 1fr; } .path li:nth-child(3) { border-left: 0; } .path li:nth-child(n+3) { border-top: 1px solid var(--line); } }
.story { display: grid; gap: 14px; }
.story h2 { font-size: 28px !important; }
.col .lead-about { font-size: 20px; line-height: 1.55; color: var(--ink); font-weight: 300; }
.pull { margin: 6px 0; padding: 26px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--display); font-style: italic; font-size: clamp(28px, 3.6vw, 38px); line-height: 1.2; color: var(--sage); text-wrap: balance; }

/* footer */
footer.site .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding-block: 28px 32px; }
footer.site .brand .word { font-size: 12.5px; }
footer.site .disc { flex: 1 1 360px; font-size: 12.5px; color: var(--muted); padding-left: 28px; border-left: 1px solid var(--line); }
footer.site .socials { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12.5px; color: var(--muted); padding-left: 28px; border-left: 1px solid var(--line); }

/* inner views */
.inner { padding-block: 64px 80px; }
.col { max-width: 720px; margin: 0 auto; display: grid; gap: 26px; }
.col h1 { font-family: var(--display); font-size: clamp(44px, 6.4vw, 70px); line-height: 1.02; }
.col h1 em { font-style: italic; color: var(--sage); }
.col h2 { font-family: var(--display); font-size: 32px; line-height: 1.12; margin-top: 10px; }
.col p { color: var(--muted); font-size: 17px; max-width: 62ch; }
.col p strong { color: var(--ink); font-weight: 500; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rows li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.rows .k { font-family: var(--mono); font-size: 12.5px; color: var(--sage); padding-top: 3px; }
.rows .v { color: var(--muted); }
.rows .v b { color: var(--ink); font-weight: 500; }
.entry { border: 1px solid var(--line); background: var(--band); padding: 28px; display: grid; gap: 14px; }
.entry .head { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.entry h2 { margin: 0; }
.entry + .entry { margin-top: 20px; }
.entry .head .g { color: var(--ink); font-weight: 500; letter-spacing: .05em; }
.entry p { color: var(--muted); }
.entry img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; }
.entry ul, .entry ol { margin: 0; padding-left: 1.2em; color: var(--muted); }
.entry h3 { font-family: var(--sans); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); margin-top: 6px; }
.entry .takeaway { max-width: none; border-top: 1px solid var(--line); padding-top: 14px; color: var(--ink); font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1.4; }
.entry .takeaway span { display: block; font-family: var(--sans); font-style: normal; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.preview .latest { margin-top: 18px; font-size: 14px; color: var(--muted); }
.preview .latest a { color: var(--ink); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 360px; font-size: 15px; }
th, td { text-align: left; padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); }
thead th { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
tbody th { font-weight: 500; }
.code { font-family: var(--mono); font-weight: 500; }
.buy { color: var(--long); } .sell { color: var(--short); }
.note { font-size: 14px !important; }
.play { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 48px; align-items: start; }
.play .phead { grid-column: 1 / -1; display: grid; grid-template-columns: auto auto; justify-content: start; gap: 12px 40px; align-items: end; }
.play .phead > h2, .play .phead > p { grid-column: 1; }
.play .phead { grid-template-rows: 1fr auto; } .play .phead > h2 { align-self: end; }
.play .sketch { grid-column: 2; grid-row: 1 / span 2; align-self: end; margin: 0 0 2px; width: 128px; }
.play .sketch svg { display: block; width: 100%; height: auto; background: var(--band); border: 1px solid var(--line); border-radius: 4px; }
.play .sketch figcaption { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.play .sketch text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
@media (max-width: 900px) { .play .phead { grid-template-columns: minmax(0, 1fr); } .play .sketch { grid-column: 1; grid-row: auto; margin-top: 8px; } }
.play h2 { font-family: var(--display); font-size: 36px; line-height: 1.1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.play h2 .code { font-size: 14px; letter-spacing: .04em; }
.play p { color: var(--muted); font-size: 16px; max-width: 62ch; }
.play p strong { color: var(--ink); font-weight: 500; }
.play h3 { font-family: var(--sans); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.play .pbody { display: grid; gap: 18px; }
.play .rows li { grid-template-columns: 92px minmax(0, 1fr); gap: 4px 16px; padding: 12px 0; }
.play .why { display: grid; gap: 12px; }
.play .note { grid-column: 1 / -1; }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.shots figure { margin: 0; display: grid; gap: 8px; }
.shots a { position: relative; display: block; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: zoom-in; }
.shots img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: contain; }
.shots a:hover, .shots a:focus-visible { border-color: var(--sage); }
.shots .ztag { position: absolute; right: 8px; bottom: 8px; padding: 4px 9px; font-size: 11.5px; letter-spacing: .06em; color: var(--ink); background: rgba(18,20,20,.82); border: 1px solid var(--line); border-radius: 3px; }
.shots figcaption { font-size: 13.5px; color: var(--muted); }
dialog.zoom { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: 96vw; max-height: 96vh; overflow: visible; }
dialog.zoom::backdrop { background: rgba(0,0,0,.88); }
dialog.zoom img { display: block; width: min(94vw, 1180px); height: auto; max-height: 80vh; object-fit: contain; background: #000; border: 1px solid var(--line); border-radius: 4px; }
dialog.zoom .zbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; }
dialog.zoom .zcap { font-size: 14px; color: var(--muted); }
dialog.zoom .zbtns { display: flex; gap: 8px; flex: none; }

<script>
(function () {
  var openDay = null; /* set by the journal dashboard: opens a date from a /journal/#YYYY-MM-DD link */
  function show() {
    if (document.body.dataset.view === 'journal' && openDay) {
      var day = (location.hash || '').slice(1).replace(/^journal\/?/, '');
      if (day) openDay(day);
    }
    requestAnimationFrame(drawAll);
  }

  /* phone menu */
  (function () {
    var btn = document.querySelector('.menu-btn'), nav = document.querySelector('nav.main');
    if (!btn || !nav) return;
    function set(open) { nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    btn.addEventListener('click', function () { set(!nav.classList.contains('open')); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && nav.classList.contains('open')) { set(false); btn.focus(); } });
    document.addEventListener('click', function (e) { if (nav.classList.contains('open') && !nav.contains(e.target)) set(false); });
  })();

  /* illustrated candles: decorative, seeded so they look the same on every load */
  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function series(seed, n, shape) {
    var r = rng(seed), out = [], p = 100;
    for (var i = 0; i < n; i++) {
      var o = p, c = o + shape(i / n) + (r() - .5) * 2.4;
      out.push({ o: o, c: c, h: Math.max(o, c) + r() * 1.3, l: Math.min(o, c) - r() * 1.3 }); p = c;
    }
    return out;
  }
  function draw(canvas, data, opts) {
    if (!canvas || !canvas.offsetWidth) return;
    var dpr = window.devicePixelRatio || 1, w = canvas.offsetWidth, h = canvas.offsetHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    var x = canvas.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    var lo = Infinity, hi = -Infinity;
    data.forEach(function (d) { lo = Math.min(lo, d.l); hi = Math.max(hi, d.h); });
    var padT = opts.padT || 28, padB = opts.padB || 18, padL = 12, padR = 12;
    var Y = function (v) { return padT + (hi - v) / (hi - lo) * (h - padT - padB); };
    var step = (w - padL - padR) / data.length, bw = Math.max(1.5, step * .55);
    x.strokeStyle = 'rgba(255,255,255,0.045)'; x.lineWidth = 1;
    for (var g = 1; g < 5; g++) { var gy = Math.round(padT + g * (h - padT - padB) / 5) + .5; x.beginPath(); x.moveTo(0, gy); x.lineTo(w, gy); x.stroke(); }
    if (opts.zone) {
      var z0 = Y(opts.zone[1]), z1 = Y(opts.zone[0]);
      x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(padL + step * opts.zone[2], z0, step * (opts.zone[3] - opts.zone[2]), z1 - z0);
      x.strokeStyle = 'rgba(236,233,226,0.35)'; x.beginPath(); x.moveTo(0, Math.round(z1) + .5); x.lineTo(w, Math.round(z1) + .5); x.stroke();
    }
    data.forEach(function (d, i) {
      var cx = padL + step * i + step / 2, up = d.c >= d.o;
      x.strokeStyle = up ? 'rgba(143,207,179,0.6)' : 'rgba(227,153,138,0.55)';

      var t = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));

      var last = data[data.length - 1], ly = Math.round(Y(last.c)) + .5;

      x.beginPath(); x.moveTo(0, ly); x.lineTo(w, ly); x.stroke(); x.setLineDash([]);
    }
  }
  var heroData = series(7, 78, function (t) { return t < .25 ? .35 : t < .45 ? -.15 : t < .55 ? .05 : .55; });
  var jData = series(19, 70, function (t) { return t < .3 ? -.05 : t < .45 ? -.55 : t < .6 ? .1 : .7; });
  /* gentle motion: the last candle forms, then a new one starts (illustration only) */
  var rr = rng(99), phase = 0, progress = 0, target = 0;
  function startCandle() {
    var p = heroData[heroData.length - 1].c; phase++;
    target = p + .22 + Math.sin(phase / 8) * .7 + (rr() - .5) * 2.2;
    heroData.push({ o: p, c: p, h: p + .2, l: p - .2 });
    if (heroData.length > 78) heroData.shift();
    progress = 0;
  }
  function tick() {
    if (document.hidden || !document.getElementById('heroChart')) return;
    var d = heroData[heroData.length - 1];
    progress += .2;
    d.c = d.o + (target - d.o) * Math.min(1, progress) + (rr() - .5) * .5;
    d.h = Math.max(d.h, d.c + rr() * .4); d.l = Math.min(d.l, d.c - rr() * .4);
    if (progress >= 1) { d.c = target; startCandle(); }
    draw(document.getElementById('heroChart'), heroData, { padT: 34, padB: 30, lastLine: true });
  }
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var liveChart = false;
  if (!still) { startCandle(); setInterval(function () { if (!liveChart) tick(); }, 500); }

  /* real ES hourly chart from TradingView. Loads only where outside scripts are allowed (e.g. GitHub Pages); otherwise the illustration stays. To change the market, edit TV_SYMBOL. */
  /* ES futures (CME_MINI:ES1!) is blocked in TradingView's free embeds, so this uses the S&P 500 index, which ES tracks closely. */
  var TV_SYMBOL = 'FOREXCOM:SPXUSD';
  (function loadTradingView() {
    var box = document.getElementById('tvBox');
    if (!box) return;
    var holder = box.querySelector('.tradingview-widget-container');
    var s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    s.async = true;
    s.textContent = JSON.stringify({ autosize: true, symbol: TV_SYMBOL, interval: '60', timezone: 'America/Los_Angeles', theme: 'dark', style: '1', locale: 'en', hide_top_toolbar: true, hide_legend: false, hide_volume: true, allow_symbol_change: false, save_image: false, calendar: false, backgroundColor: 'rgba(10, 12, 11, 1)', gridColor: 'rgba(255, 255, 255, 0.04)', support_host: 'https://www.tradingview.com' });
    s.onload = function () {
      liveChart = true;
      box.hidden = false;
      document.getElementById('heroChart').style.visibility = 'hidden';
      document.getElementById('illusLabel').hidden = true;
      document.getElementById('tvCredit').hidden = false;
      var chip = document.querySelector('.screen .chip');
      chip.lastChild.textContent = 'ES · 1 HOUR';
      chip.style.display = 'none';
    };
    s.onerror = function () { /* blocked here: keep the illustration */ };
    holder.appendChild(s);
  })();

  function drawAll() {
    draw(document.getElementById('heroChart'), heroData, { padT: 34, padB: 30, lastLine: true });
  }
  var timer; window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(drawAll, 120); });
  /* journal dashboard: calendar built from the posts Jekyll renders into #entries */
  (function () {
    var store = document.getElementById('entries');
    var grid = document.getElementById('calGrid');
    if (!store || !grid) return;
    var posts = Array.prototype.slice.call(store.querySelectorAll('article.entry'));
    var byDate = {};
    posts.forEach(function (a) { (byDate[a.dataset.date] = byDate[a.dataset.date] || []).push(a); });
    var monthEl = document.getElementById('calMonth'), countEl = document.getElementById('calCount');
    var panel = document.getElementById('entryPanel'), list = document.getElementById('entryList');
    var navs = document.querySelectorAll('.cal-nav');
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var now = new Date();
    var todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
    function isSat(a) { var s = (a.dataset.status || '').replace('-', ' '); return s === 'sat out'; }
    var dates = Object.keys(byDate).sort();
    var first = dates.length ? dates[0] : todayKey, last = dates.length ? dates[dates.length - 1] : todayKey;
    var minYM = +first.slice(0, 4) * 12 + (+first.slice(5, 7) - 1);
    var maxYM = Math.max(now.getFullYear() * 12 + now.getMonth(), +last.slice(0, 4) * 12 + (+last.slice(5, 7) - 1));
    var selected = dates.length ? last : null;
    var ym = selected ? +selected.slice(0, 4) * 12 + (+selected.slice(5, 7) - 1) : maxYM;

    function render() {
      var y = Math.floor(ym / 12), m = ym % 12;
      monthEl.textContent = MONTHS[m] + ' ' + y;
      navs[0].disabled = ym <= minYM; navs[1].disabled = ym >= maxYM;
      grid.innerHTML = '';
      var startDow = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), n = 0;
      for (var i = 0; i < startDow; i++) { var p = document.createElement('span'); p.className = 'day pad'; p.setAttribute('aria-hidden', 'true'); grid.appendChild(p); }
      for (var d = 1; d <= days; d++) {
        var k = key(y, m, d), all = byDate[k], a = all && all[0], dow = (startDow + d - 1) % 7;
        var el = document.createElement(a ? 'button' : 'span');
        el.className = 'day' + (dow === 0 || dow === 6 ? ' wknd' : '') + (k > todayKey ? ' future' : '') + (k === todayKey ? ' today' : '') + (a ? ' has' : '') + (k === selected ? ' sel' : '');
        var num = document.createElement('span'); num.textContent = d; el.appendChild(num);
        if (a) {
          n += all.length;
          el.type = 'button';
          el.setAttribute('aria-label', MONTHS[m] + ' ' + d + ': ' + all.map(function (x) { return x.dataset.title; }).join('; ') + (isSat(a) ? ' (sat out)' : '') + (a.dataset.grade ? ', grade ' + a.dataset.grade : ''));
          if (k === selected) el.setAttribute('aria-pressed', 'true');
          var mk = document.createElement('span'); mk.className = 'mk';
          var dot = document.createElement('i'); dot.className = 'dot ' + (isSat(a) ? 'sat' : 'traded'); mk.appendChild(dot);
          if (a.dataset.grade) { var g = document.createElement('b'); g.className = 'gr'; g.textContent = a.dataset.grade; mk.appendChild(g); }
          el.appendChild(mk);
          el.addEventListener('click', select.bind(null, k, false));
        }
        grid.appendChild(el);
      }
      countEl.textContent = n === 1 ? '1 entry' : n + ' entries';
    }
    function showEntry() {
      panel.innerHTML = '';
      if (!selected) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = 'No entries yet. The first one is coming soon.'; panel.appendChild(e); return; }
      byDate[selected].forEach(function (a) { panel.appendChild(a.cloneNode(true)); });
      Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) { b.setAttribute('aria-current', b.dataset.date === selected ? 'true' : 'false'); });
    }
    function select(k, jump) {
      selected = k;
      if (jump) ym = +k.slice(0, 4) * 12 + (+k.slice(5, 7) - 1);
      render(); showEntry();
      if (history.replaceState && location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
    }
    posts.forEach(function (a) {
      var k = a.dataset.date, li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.date = k;
      var dt = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10));
      var d = document.createElement('span'); d.className = 'd'; d.textContent = MONTHS[dt.getMonth()].slice(0, 3) + ' ' + dt.getDate() + ', ' + dt.getFullYear();
      var t = document.createElement('span'); t.textContent = a.dataset.title;
      var s = document.createElement('span'); s.className = 's'; s.textContent = isSat(a) ? 'Sat out' : (a.dataset.setup || '');
      var g = document.createElement('span'); g.className = 'g'; g.textContent = a.dataset.grade || '';
      b.append(d, t, s, g);
      b.addEventListener('click', function () { select(k, true); panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
      li.appendChild(b); list.appendChild(li);
    });
    if (!dates.length) document.querySelector('.jlist').hidden = true;
    Array.prototype.forEach.call(navs, function (b) { b.addEventListener('click', function () { ym += +b.dataset.step; render(); }); });
    render(); showEntry();
    openDay = function (k) {
      if (!byDate[k]) return;
      selected = k; ym = +k.slice(0, 4) * 12 + (+k.slice(5, 7) - 1);
      render(); showEntry();
    };
  })();
  window.addEventListener('hashchange', show);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
  show();
})();
</script>

<dialog class="zoom" id="zoom" aria-label="Enlarged chart">
  <img id="zoomImg" src="" alt="">
  <div class="zbar"><span class="zcap" id="zoomCap"></span><span class="zbtns"><button type="button" id="zoomPrev" aria-label="Previous chart">←</button><button type="button" id="zoomNext" aria-label="Next chart">→</button><button type="button" id="zoomClose">Close</button></span></div>
</dialog>
<script>
(function () {
  var d = document.getElementById('zoom'); if (!d || !d.showModal) return;
  var img = document.getElementById('zoomImg'), cap = document.getElementById('zoomCap'), set = [], i = 0;
  var prev = document.getElementById('zoomPrev'), next = document.getElementById('zoomNext'), close = document.getElementById('zoomClose');
  function draw() { var a = set[i], f = a.closest('figure'), c = f && f.querySelector('figcaption'), im = a.querySelector('img'); img.src = a.href; img.alt = im ? im.alt : ''; cap.textContent = c ? c.textContent : (a.closest('.entry') && im ? im.alt : ''); }
  function step(n) { i = (i + n + set.length) % set.length; draw(); }
  var isImg = /\.(png|jpe?g|webp|gif)(\?|#|$)/i;
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var a = e.target.closest('.shots a'), box, journal = false;
    if (a) box = a.closest('.shots');
    else { a = e.target.closest('.entry a'); if (!a || !isImg.test(a.getAttribute('href') || '') || !a.querySelector('img')) return; box = a.closest('.entry'); journal = true; }
    e.preventDefault();
    set = Array.prototype.slice.call(box.querySelectorAll('a')).filter(function (x) { return x.querySelector('img') && (!journal || isImg.test(x.getAttribute('href') || '')); });
    i = set.indexOf(a); draw();
    prev.hidden = next.hidden = set.length < 2;
    close.textContent = journal ? '\u2190 Back to journal' : 'Close';
    d.showModal();
  });
  prev.addEventListener('click', function () { step(-1); });
  next.addEventListener('click', function () { step(1); });
  close.addEventListener('click', function () { d.close(); });
  d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
  d.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
})();
</script>
<script>
/* motion: phase 1 */
(function () {
  var hero = document.querySelector('.hero');
  if (hero && !hero.querySelector('.trendline')) {
    var ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg'), l = document.createElementNS(ns, 'polyline');
    s.setAttribute('class', 'trendline'); s.setAttribute('viewBox', '0 0 1200 200'); s.setAttribute('preserveAspectRatio', 'none'); s.setAttribute('aria-hidden', 'true');
    l.setAttribute('points', '0,194 150,182 210,190 350,170 420,182 480,174 630,122 710,142 770,130 910,72 990,94 1060,80 1200,22'); l.setAttribute('pathLength', '1');
    s.appendChild(l); hero.insertBefore(s, hero.firstChild);
  }
  var ok = window.matchMedia && window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
  if (!ok || !('IntersectionObserver' in window)) return;
  document.querySelectorAll('.sketch polyline').forEach(function (p) { p.setAttribute('pathLength', '1'); });
  var targets = document.querySelectorAll('#home > section:not(.hero), .inner .col > *, .play, .jhead, .jcard, .jcovers, .jlist');
  targets.forEach(function (el) { el.classList.add('rv'); });
  document.documentElement.classList.add('mo');
  var io = new IntersectionObserver(function (es) {
    var i = 0;
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      if (el.classList.contains('rv')) { el.style.transitionDelay = Math.min(i++, 4) * 70 + 'ms'; }
      el.classList.add('in'); io.unobserve(el);
    });
  }, { rootMargin: '0px 0px -6% 0px' });
  targets.forEach(function (el) { io.observe(el); });
  document.querySelectorAll('.sketch, .trendline').forEach(function (el) { io.observe(el); });
})();
</script>
